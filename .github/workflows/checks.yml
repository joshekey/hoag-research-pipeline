name: Synthetic workflow checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - run: python -m unittest discover -s tests -v
      - run: npx playwright install --with-deps chromium
      - run: python scripts/fetch_ohif_assets.py .browser-fixtures/ohif-assets
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-results
          path: test-results/
      - run: bash -n install.sh
      - run: bash -n scripts/configure
      - run: node --check static/app.js
      - run: node --check static/report-browser.js
      - run: node --check static/research-workspace.js
