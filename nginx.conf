server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/pki/tls/certs/hoag-research.crt;
    ssl_certificate_key /etc/pki/tls/private/hoag-research.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/hoag-research-error.log crit;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
